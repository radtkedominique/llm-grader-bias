[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-grader-bias"
version = "0.1.0"
description = "Self- und Family-Bias bei der Korrektur von Abituraufgaben durch LLMs"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "statsmodels>=0.14"]
analysis = ["statsmodels>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
